[build]
  # Build command - just copy files since this is a static site
  command = "npm run build"
  
  # Directory to publish
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Headers for better caching
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Development settings
[dev]
  command = "npm run dev"
  port = 8080
